<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visit test room</title>
<style>
/* A workroom to test visit.js with: its room is a floor plan (walls, a desk), drawn from above, with
   each visitor an arrow where it stands and looks. The page gets its visit-client's port and token from
   the URL fragment (#port=7401&token=...), one of INTEGRATING.md's ways. ?three=1 makes the same room in
   three.js (r128), and shares its scene with visitors whose page draws scenes (SPEC 8.3); ?scenes=0 makes
   this page draw none (video only, as a visitor). */
html, body { height: 100%; margin: 0; background: #0d1117; color: #e6edf3; font: 13px system-ui, sans-serif; }
#own, #own3 { position: fixed; inset: 0; width: 100%; height: 100%; }
#panel { position: fixed; top: 12px; right: 12px; width: 320px; }
</style>
</head>
<body>
<canvas id="own"></canvas>
<canvas id="own3" hidden></canvas>
<div id="panel"></div>
<script>
"use strict";
// The room: 10 x 8 units, walls round it, a desk in the middle. x right, z down the page; a visitor's yaw 0
// looks toward -z (up the page).
const ROOM = { w: 10, d: 8, desk: { x: 4, z: 3, w: 2, d: 1.2 } };
const blocked = (x, z) => x < 0.3 || x > ROOM.w - 0.3 || z < 0.3 || z > ROOM.d - 0.3
  || (x > ROOM.desk.x - 0.3 && x < ROOM.desk.x + ROOM.desk.w + 0.3 && z > ROOM.desk.z - 0.3 && z < ROOM.desk.z + ROOM.desk.d + 0.3);
const hue = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

function drawRoom(ctx, w, h, visitors, me) {
  const k = Math.min(w / (ROOM.w + 1), h / (ROOM.d + 1)), ox = (w - ROOM.w * k) / 2, oz = (h - ROOM.d * k) / 2;
  ctx.fillStyle = "#1d232b"; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#2b3138"; ctx.fillRect(ox, oz, ROOM.w * k, ROOM.d * k);
  ctx.strokeStyle = "#8b949e"; ctx.lineWidth = Math.max(2, k * 0.1); ctx.strokeRect(ox, oz, ROOM.w * k, ROOM.d * k);
  ctx.fillStyle = "#b98b5e"; ctx.fillRect(ox + ROOM.desk.x * k, oz + ROOM.desk.z * k, ROOM.desk.w * k, ROOM.desk.d * k);
  for (const v of visitors) {
    if (!v.pose) continue;
    const x = ox + v.pose.x * k, z = oz + v.pose.z * k, r = k * 0.3;
    ctx.fillStyle = `hsl(${hue(v.name)}, 70%, 55%)`;
    ctx.beginPath(); ctx.arc(x, z, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.moveTo(x, z); ctx.lineTo(x - Math.sin(v.pose.yaw) * r * 2.2, z - Math.cos(v.pose.yaw) * r * 2.2); ctx.stroke();
    ctx.fillStyle = "#e6edf3"; ctx.font = `${Math.round(k * 0.35)}px system-ui`; ctx.fillText(v.name, x + r * 1.2, z - r);
  }
  ctx.fillStyle = "#e6edf3"; ctx.font = `${Math.round(Math.max(12, k * 0.4))}px system-ui`;
  ctx.fillText(me, 12, Math.max(20, k * 0.6));
}

// For the perf test (perf/run-perf.sh): ?scene=busy draws what a visitor sees as a first-person room would
// (textured panels sliding past as it turns and walks: frames the size a real 3D room's are), and ?cost=N
// spends N ms more on every render (a heavy room).
const OPTS = new URLSearchParams(location.search), SCENE = OPTS.get("scene"), COST = Number(OPTS.get("cost")) || 0;
const NOISE = (() => {
  const c = new OffscreenCanvas(256, 256), x = c.getContext("2d"), d = x.createImageData(256, 256);
  let s = 7;
  for (let i = 0; i < d.data.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const v = 80 + (s >> 16) % 48; d.data[i] = v; d.data[i + 1] = v + 6; d.data[i + 2] = v + 12; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  return c;
})();
function drawBusy(ctx, w, h, pose) {
  const shift = ((pose.yaw || 0) * w * 1.5) % w, near = 1 + (ROOM.d - (pose.z || 0)) * 0.06;
  ctx.save(); ctx.translate(shift, 0); ctx.fillStyle = ctx.createPattern(NOISE, "repeat"); ctx.fillRect(-w, 0, w * 3, h); ctx.restore();
  for (let i = -3; i < 14; i++) {
    const x = (i * w / 10) * near + shift;
    ctx.fillStyle = `hsl(${(i * 47 + 360) % 360}, 45%, ${32 + ((i % 3) + 3) % 3 * 9}%)`; ctx.fillRect(x, h * 0.22, (w / 14) * near, h * 0.55);
    ctx.fillStyle = "#e6edf3"; ctx.font = `${Math.round(h / 22)}px system-ui`; ctx.fillText("desk " + i, x + 6, h * 0.22 + h / 18);
  }
}

// ?three=1: the room in three.js, its scene shared with visitors whose page draws scenes. window.room has what a
// test changes while a visitor looks: a spinning cube that circles the desk, a sign whose text it redraws, and
// objects added and taken away.
async function threeRoom(v) {
  const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js");
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1d232b);
  scene.fog = new THREE.Fog(0x1d232b, 12, 40);
  const lambert = c => new THREE.MeshLambertMaterial({ color: c });
  const box = (w, h, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; scene.add(o); return o; };
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), lambert(0x2b3138));
  floor.rotation.x = -Math.PI / 2; floor.position.set(ROOM.w / 2, 0, ROOM.d / 2); floor.receiveShadow = true; scene.add(floor);
  const wall = lambert(0x8b949e);
  box(ROOM.w, 2.5, 0.1, wall, ROOM.w / 2, 1.25, 0); box(ROOM.w, 2.5, 0.1, wall, ROOM.w / 2, 1.25, ROOM.d);
  box(0.1, 2.5, ROOM.d, wall, 0, 1.25, ROOM.d / 2); box(0.1, 2.5, ROOM.d, wall, ROOM.w, 1.25, ROOM.d / 2);
  const desk = box(ROOM.desk.w, 0.75, ROOM.desk.d, lambert(0xb98b5e), ROOM.desk.x + ROOM.desk.w / 2, 0.375, ROOM.desk.z + ROOM.desk.d / 2);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(8, 10, 6); sun.target.position.set(5, 0, 4); scene.add(sun.target); sun.castShadow = true; scene.add(sun);
  const spinner = box(0.4, 0.4, 0.4, lambert(0x3fb950), 5, 1.2, 3.6);
  spinner.name = "spinner";
  const signCanvas = document.createElement("canvas"); signCanvas.width = 256; signCanvas.height = 64;
  const signTex = new THREE.CanvasTexture(signCanvas);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.5), new THREE.MeshBasicMaterial({ map: signTex }));
  sign.position.set(ROOM.w / 2, 1.8, 0.06); scene.add(sign);
  const write = text => { const x = signCanvas.getContext("2d"); x.fillStyle = "#0d1117"; x.fillRect(0, 0, 256, 64); x.fillStyle = "#e6edf3"; x.font = "28px sans-serif"; x.fillText(text, 12, 42); signTex.needsUpdate = true; };
  write("test room");
  // Visitors' bodies: each where it stands, marked as its own (userData.visitor), so its own eyes do not see it.
  const bodies = new Map();
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("own3"), antialias: true });
  renderer.shadowMap.enabled = true;
  const top = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  top.position.set(ROOM.w / 2, 11, ROOM.d + 4); top.lookAt(ROOM.w / 2, 0, ROOM.d / 2);
  document.getElementById("own").hidden = true; document.getElementById("own3").hidden = false;
  window.room = { THREE, scene, spinner, sign, write, bodies, frozen: false,
    add(name) { const o = box(0.3, 0.3, 0.3, lambert(0xe3b341), 2, 0.15, 2); o.name = name; return o.uuid; },
    remove(name) { const o = scene.getObjectByName(name); if (o) scene.remove(o); },
    shader() { const o = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.ShaderMaterial({ vertexShader: "void main(){gl_Position=vec4(0.);}", fragmentShader: "void main(){gl_FragColor=vec4(1.);}" })); o.name = "shader"; scene.add(o); return o.uuid; } };
  (function frame(t) {
    requestAnimationFrame(frame);
    if (!window.room.frozen) {
      const a = t / 1000;
      spinner.position.set(5 + Math.cos(a) * 2.2, 1.2, 3.6 + Math.sin(a) * 1.6); spinner.rotation.y = a * 2;
    }
    const here = new Set();
    for (const x of v.visitors) {
      if (!x.pose) continue;
      here.add(x.id);
      let b = bodies.get(x.id);
      if (!b) { b = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.7, 0.4), lambert(0x58a6ff)); b.userData.visitor = x.id; b.name = "body:" + x.visitor.name; scene.add(b); bodies.set(x.id, b); }
      b.position.set(x.pose.x, 0.85, x.pose.z); b.rotation.y = x.pose.yaw;
    }
    for (const [id, b] of bodies) if (!here.has(id)) { scene.remove(b); bodies.delete(id); }
    const c = renderer.domElement;
    if (c.width !== c.clientWidth || c.height !== c.clientHeight) { renderer.setSize(c.clientWidth, c.clientHeight, false); top.aspect = c.clientWidth / c.clientHeight; top.updateProjectionMatrix(); }
    renderer.render(scene, top);
  })(0);
  // For a visitor that draws no scenes: video, rendered by a second renderer from where it stands.
  const eye = new THREE.WebGLRenderer({ antialias: true }), cam = new THREE.PerspectiveCamera(70, 16 / 9, 0.05, 100);
  cam.rotation.order = "YXZ";
  return {
    THREE, scene, renderer,
    render(pose, w, h) {
      eye.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
      cam.position.set(pose.x, pose.y, pose.z); cam.rotation.set(pose.pitch, pose.yaw, 0);
      eye.render(scene, cam);
      window.renders++;
      return eye.domElement;
    },
  };
}

const own = document.getElementById("own"), ownCtx = own.getContext("2d");
const visitCanvas = document.createElement("canvas"), visitCtx = visitCanvas.getContext("2d");
window.renders = 0;

(async () => {
  // The fragment hands over the port and token once; sessionStorage keeps them for this tab's reloads (no
  // other site can read it), and the address bar loses them.
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("token")) {
    sessionStorage.setItem("visit", JSON.stringify({ port: Number(p.get("port")), token: p.get("token") }));
    history.replaceState(null, "", location.pathname + location.search);
  }
  const { port, token } = JSON.parse(sessionStorage.getItem("visit") || "{}");
  await new Promise((ok, fail) => { const s = document.createElement("script"); s.src = `http://127.0.0.1:${port}/visit.js`; s.onload = ok;
    s.onerror = () => fail(new Error(`visit-client is not running on 127.0.0.1:${port}`)); document.head.appendChild(s); });
  const v = window.v = await Visit.connect({ port, token, sim: { name: "test-room", version: "1" }, scenes: OPTS.get("scenes") !== "0" });
  if (OPTS.get("three")) {
    const t = await threeRoom(v);
    v.host({
      spawn: () => ({ x: 2, y: 1.6, z: 6, yaw: 0, pitch: 0 }),
      move: (pose, input, dt) => Visit.walk(pose, input, dt, { speed: 2.5, blocked }),
      render: t.render,
      fov: 70,
      scene: { root: t.scene, three: t.THREE, renderer: t.renderer, near: 0.05, far: 100 },
      walk: { speed: 2.5 },   // as move() walks: the visitor's page walks at once, before the answer
    });
    Visit.panel(document.getElementById("panel"), v);
    Visit.stage(v);
    return;
  }
  v.host({
    spawn: () => ({ x: 2, y: 1.6, z: 6, yaw: 0, pitch: 0 }),
    move: (pose, input, dt) => Visit.walk(pose, input, dt, { speed: 2.5, blocked }),
    fov: 70,   // as a first-person camera would say (this room is drawn from above: a test of the visitor's turning only)
    render(pose, width, height) {
      visitCanvas.width = width; visitCanvas.height = height;
      if (SCENE === "busy") drawBusy(visitCtx, width, height, pose);
      else drawRoom(visitCtx, width, height, v.visitors.map(x => ({ name: x.visitor.name, pose: x.pose })), `${v.office ? v.office.name : "?"}'s room`);
      if (COST) { const end = performance.now() + COST; while (performance.now() < end) { /* a heavy room's render */ } }
      window.renders++;
      return visitCanvas;
    },
  });
  Visit.panel(document.getElementById("panel"), v);
  Visit.stage(v);   // the room visited: full-window, or in a corner while back in this one
  (function paint() {
    own.width = innerWidth; own.height = innerHeight;
    drawRoom(ownCtx, own.width, own.height, v.visitors.map(x => ({ name: x.visitor.name, pose: x.pose })), `${v.office ? v.office.name : "?"}'s room (yours)`);
    requestAnimationFrame(paint);
  })();
})().catch(e => { document.body.insertAdjacentHTML("beforeend", `<p style="position:fixed;bottom:8px;left:8px">${e.message}</p>`); console.error(e); });
</script>
</body>
</html>
