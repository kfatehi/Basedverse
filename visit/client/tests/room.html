<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visit test room</title>
<style>
/* A workroom to test visit.js with: a small three.js room (r128; ?three=160, another release), walls round it and a desk in the middle,
   seen from above, its scene shared with its visitors (SPEC 8). The page gets its visit-client's port and
   token from the URL fragment (#port=7401&token=...), one of INTEGRATING.md's ways. ?movers=N adds N cubes
   circling the room (for the perf test: a busy scene). ?world=1: its world (../../WORLD.md): a doorway in each
   wall, you as an orange block walking with WASD (Q and E turn), seen from behind, your friends' plots round it. */
html, body { height: 100%; margin: 0; background: #0d1117; color: #e6edf3; font: 13px system-ui, sans-serif; }
#own { position: fixed; inset: 0; width: 100%; height: 100%; }
#panel { position: fixed; top: 12px; right: 12px; width: 320px; }
</style>
</head>
<body>
<canvas id="own"></canvas>
<div id="panel"></div>
<script>
"use strict";
// The room: 10 x 8 units, walls round it, a desk in the middle; y up, a visitor's yaw 0 looking toward -z.
const ROOM = { w: 10, d: 8, desk: { x: 4, z: 3, w: 2, d: 1.2 } };
const OPTS = new URLSearchParams(location.search), MOVERS = Math.min(2000, Number(OPTS.get("movers")) || 0), WORLD = OPTS.get("world") === "1";
// In a world, a doorway 1.4 wide in the middle of each wall, and nothing in the way outside the room.
const DOOR = 0.7, door = (along, mid) => WORLD && Math.abs(along - mid) < DOOR - 0.25;
const inRoom = (x, z) => x > -0.3 && x < ROOM.w + 0.3 && z > -0.3 && z < ROOM.d + 0.3;
// The nearest spot to x, z (within 3 m) that nothing blocks; null if none.
const freeNear = (x, z) => { for (let r = 0; r <= 3; r += 0.25) for (let k = 0; k < (r ? 16 : 1); k++) { const a = k * Math.PI / 8, p = [x + Math.cos(a) * r, z + Math.sin(a) * r]; if (!blocked(...p)) return p; } return null; };
const blocked = (x, z) => (WORLD && !inRoom(x, z)) ? false
  : ((x < 0.3 && !door(z, ROOM.d / 2)) || (x > ROOM.w - 0.3 && !door(z, ROOM.d / 2)) || (z < 0.3 && !door(x, ROOM.w / 2)) || (z > ROOM.d - 0.3 && !door(x, ROOM.w / 2))
  || (x > ROOM.desk.x - 0.3 && x < ROOM.desk.x + ROOM.desk.w + 0.3 && z > ROOM.desk.z - 0.3 && z < ROOM.desk.z + ROOM.desk.d + 0.3));

// The room in three.js. window.room has what a test changes while a visitor looks: a spinning cube that
// circles the desk, a sign whose text it redraws, and objects added and taken away.
async function build(v) {
  const THREE = await import(`https://cdn.jsdelivr.net/npm/three@0.${Number(OPTS.get("three")) || 128}.0/build/three.module.js`);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1d232b);
  scene.fog = new THREE.Fog(0x1d232b, 12, 40);
  const lambert = c => new THREE.MeshLambertMaterial({ color: c });
  const box = (w, h, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; scene.add(o); return o; };
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), lambert(0x2b3138));
  floor.rotation.x = -Math.PI / 2; floor.position.set(ROOM.w / 2, 0, ROOM.d / 2); floor.receiveShadow = true; scene.add(floor);
  const wall = lambert(0x8b949e);
  if (!WORLD) {
    box(ROOM.w, 2.5, 0.1, wall, ROOM.w / 2, 1.25, 0); box(ROOM.w, 2.5, 0.1, wall, ROOM.w / 2, 1.25, ROOM.d);
    box(0.1, 2.5, ROOM.d, wall, 0, 1.25, ROOM.d / 2); box(0.1, 2.5, ROOM.d, wall, ROOM.w, 1.25, ROOM.d / 2);
  } else {   // each wall in two halves, a doorway between
    const hw = ROOM.w / 2 - DOOR, hd = ROOM.d / 2 - DOOR;
    for (const z of [0, ROOM.d]) { box(hw, 2.5, 0.1, wall, hw / 2, 1.25, z); box(hw, 2.5, 0.1, wall, ROOM.w - hw / 2, 1.25, z); }
    for (const x of [0, ROOM.w]) { box(0.1, 2.5, hd, wall, x, 1.25, hd / 2); box(0.1, 2.5, hd, wall, x, 1.25, ROOM.d - hd / 2); }
  }
  const desk = box(ROOM.desk.w, 0.75, ROOM.desk.d, lambert(0xb98b5e), ROOM.desk.x + ROOM.desk.w / 2, 0.375, ROOM.desk.z + ROOM.desk.d / 2);
  // The floor, the walls and the desk never change: its landscape (SPEC 8.10), sent once and kept by visitors.
  for (const o of scene.children) if (o === floor || o === desk || o.material === wall) o.userData.visitStatic = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(8, 10, 6); sun.target.position.set(5, 0, 4); scene.add(sun.target); sun.castShadow = true; scene.add(sun);
  const spinner = box(0.4, 0.4, 0.4, lambert(0x3fb950), 5, 1.2, 3.6);
  spinner.name = "spinner";
  // Something a visitor may click (userData.visitPoint: an interaction this room takes, "spin"); and what a room
  // keeps for itself, which never leaves it. And a box marked with a type the room does not take: nothing.
  spinner.userData = { visitPoint: "spin", secret: "A's own" };
  const vault = box(0.4, 0.4, 0.4, lambert(0x8957e5), 9, 1.2, 1.2);
  vault.name = "vault"; vault.userData = { visitPoint: "open-vault" };
  const movers = [...Array(MOVERS)].map((_, i) => box(0.15, 0.15, 0.15, lambert(0xe3b341), 5, 0.5 + (i % 10) * 0.15, 4));
  const signCanvas = document.createElement("canvas"); signCanvas.width = 256; signCanvas.height = 64;
  const signTex = new THREE.CanvasTexture(signCanvas);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.5), new THREE.MeshBasicMaterial({ map: signTex }));
  // A sprite (as a name tag is): a click followed into the scene meets it too (a camera is needed for that).
  const tagSprite = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xe3b341 })); tagSprite.position.set(1, 2.2, 1); tagSprite.name = "tag"; scene.add(tagSprite);
  sign.position.set(ROOM.w / 2, 1.8, 0.06); scene.add(sign);
  sign.userData = { owner: { session: "s-1234" }, part: spinner };
  const write = text => { const x = signCanvas.getContext("2d"); x.fillStyle = "#0d1117"; x.fillRect(0, 0, 256, 64); x.fillStyle = "#e6edf3"; x.font = "28px sans-serif"; x.fillText(text, 12, 42); signTex.needsUpdate = true; };
  write(`${v.office ? v.office.name : "test"}'s room`);
  // Visitors' bodies: each where it stands, marked as its own (userData.visitor), so its own eyes do not see it.
  const bodies = new Map();
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("own"), antialias: true });
  renderer.shadowMap.enabled = true;
  const top = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  top.position.set(ROOM.w / 2, 11, ROOM.d + 4); top.lookAt(ROOM.w / 2, 0, ROOM.d / 2);
  window.renders = 0;
  // In a world: you, an orange block, walking with WASD (Q, E turn), seen from behind and above.
  const me = { x: ROOM.w / 2, y: 0, z: ROOM.d - 1.5, yaw: 0, pitch: 0 }, keys = new Set(), meBody = WORLD ? box(0.5, 1.7, 0.5, lambert(0xf0883e), 0, 0.85, 0) : null;
  // Our own keys, but not while a room we went to has them (v.viewFocused).
  if (WORLD) { meBody.name = "me"; addEventListener("keydown", e => { if (!(window.v && v.viewFocused)) keys.add(e.code); }); addEventListener("keyup", e => keys.delete(e.code)); }
  window.room = { THREE, scene, spinner, vault, sign, write, bodies, frozen: false, me, keys, world: null, where: null,
    add(name) { const o = box(0.3, 0.3, 0.3, lambert(0xe3b341), 2, 0.15, 2); o.name = name; return o.uuid; },
    remove(name) { const o = scene.getObjectByName(name); if (o) scene.remove(o); },
    shader() { const o = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.ShaderMaterial({ vertexShader: "void main(){gl_Position=vec4(0.);}", fragmentShader: "void main(){gl_FragColor=vec4(1.);}" })); o.name = "shader"; scene.add(o); return o.uuid; } };
  let last = 0;
  (function frame(t) {
    requestAnimationFrame(frame);
    const a = t / 1000, dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
    last = t;
    if (!window.room.frozen) { spinner.position.set(5 + Math.cos(a) * 2.2, 1.2, 3.6 + Math.sin(a) * 1.6); spinner.rotation.y = a * 2; }
    movers.forEach((m, i) => { const b = a + i * 0.37; m.position.set(5 + Math.cos(b) * 4, m.position.y, 4 + Math.sin(b * 1.3) * 3.2); m.rotation.x = b; });
    const here = new Set();
    for (const x of v.visitors) {
      if (!x.pose) continue;
      here.add(x.id);
      // A visitor as itself (its own avatar, when this room shows its look: SPEC 8.6), else as one of ours: a box.
      let b = bodies.get(x.id);
      if (b && b !== x.avatar && (x.avatar || b.name.startsWith("avatar:"))) { scene.remove(b); bodies.delete(x.id); b = null; }   // its look changed
      if (!b && x.avatar) { b = x.avatar; scene.add(b); bodies.set(x.id, b); }
      if (!b) { b = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.7, 0.4), lambert(0x58a6ff)); b.userData.visitor = x.id; b.name = "body:" + x.visitor.name; scene.add(b); bodies.set(x.id, b); }
      b.position.set(x.pose.x, x.avatar ? 0 : 0.85, x.pose.z); b.rotation.y = x.pose.yaw;
    }
    for (const [id, b] of bodies) if (!here.has(id)) { scene.remove(b); bodies.delete(id); }
    const c = renderer.domElement;
    if (c.width !== c.clientWidth || c.height !== c.clientHeight) { renderer.setSize(c.clientWidth, c.clientHeight, false); top.aspect = c.clientWidth / c.clientHeight; top.updateProjectionMatrix(); }
    const world = window.room.world;
    if (world) {
      const k = x => keys.has(x), input = { forward: (k("KeyW") ? 1 : 0) - (k("KeyS") ? 1 : 0), strafe: (k("KeyD") ? 1 : 0) - (k("KeyA") ? 1 : 0), run: k("ShiftLeft") };
      me.yaw += ((k("KeyQ") ? 1 : 0) - (k("KeyE") ? 1 : 0)) * 2 * dt;
      if (!world.inside) Object.assign(me, Visit.walk(me, input, dt, { speed: 3, blocked }));   // at home: our own walking, our own walls
      const at = world.frame(dt, me, input);
      Object.assign(me, { x: at.x, y: at.y, z: at.z });   // all of it kept, y too: it must not climb, nor stay up
      window.room.where = at.in; window.room.atY = at.y;
      meBody.position.set(me.x, 0.85, me.z); meBody.rotation.y = me.yaw;
      top.position.set(me.x + Math.sin(me.yaw) * 7, 6, me.z + Math.cos(me.yaw) * 7); top.lookAt(me.x, 0.8, me.z);
      world.render(top);
    } else renderer.render(scene, top);
    window.renders++;
  })(0);
  return { THREE, scene, renderer };
}

(async () => {
  // The fragment hands over the port and token once; sessionStorage keeps them for this tab's reloads (no
  // other site can read it), and the address bar loses them.
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("token")) {
    sessionStorage.setItem("visit", JSON.stringify({ port: Number(p.get("port")), token: p.get("token") }));
    history.replaceState(null, "", location.pathname + location.search);
  }
  const { port, token } = JSON.parse(sessionStorage.getItem("visit") || "{}");
  await new Promise((ok, fail) => { const s = document.createElement("script"); s.src = `http://127.0.0.1:${port}/visit.js`; s.onload = ok;
    s.onerror = () => fail(new Error(`visit-client is not running on 127.0.0.1:${port}`)); document.head.appendChild(s); });
  const v = window.v = await Visit.connect({ port, token, sim: { name: "test-room", version: "1" } });
  const t = await build(v);
  v.host({
    // Where a visitor appears; in a world, where it stepped in (`at`), or the nearest free spot to it (a desk may be there).
    spawn: (who, { at } = {}) => { const near = at && freeNear(at.x, at.z), p = near ? { x: near[0], y: 1.6, z: near[1], yaw: at.yaw, pitch: 0 } : { x: 2, y: 1.6, z: 6, yaw: 0, pitch: 0 }; (window.spawns = window.spawns || []).push({ who: who.name, at: at || null, p, t: Math.round(performance.now()) }); return p; },
    // room.lift (the test sets it): a lift under every visitor, that far up from where they came in
    move: (pose, input, dt, who) => { window.movedFor = who && who.id; const p = Visit.walk(pose, input, dt, { speed: 2.5, blocked }); return window.room.lift != null ? Object.assign({}, p, { y: 1.6 + window.room.lift }) : p; },
    fov: 70,
    scene: { root: t.scene, three: t.THREE, renderer: t.renderer, near: 0.05, far: 100 },
    walk: { speed: 2.5 },   // as move() walks: the visitor's page walks at once, before the answer
    plot: { center: [ROOM.w / 2, ROOM.d / 2], size: [ROOM.w, ROOM.d] },   // its land, in a world: the room's floor
    unit: 1,   // metres
  });
  if (WORLD) window.room.world = v.world({ scene: t.scene, renderer: t.renderer });
  // Our own avatar (SPEC 8.6): how a room that shows its visitors' own looks shows us. Its feet at its origin, facing
  // -z; it bobs its head standing about, and sways walking.
  const T = t.THREE, av = new T.Group();
  const torso = new T.Mesh(new T.CylinderGeometry(0.25, 0.25, 1.2, 12), new T.MeshLambertMaterial({ color: 0xa371f7 }));
  const head = new T.Mesh(new T.SphereGeometry(0.22, 12, 8), new T.MeshLambertMaterial({ color: 0xffd7a8 }));
  torso.name = "torso"; torso.position.y = 0.6; head.name = "head"; head.position.y = 1.45;
  av.add(torso, head);
  av.animations = [new T.AnimationClip("idle", 2, [new T.NumberKeyframeTrack("head.position[y]", [0, 1, 2], [1.45, 1.5, 1.45])]),
                   new T.AnimationClip("walk", 0.6, [new T.NumberKeyframeTrack("torso.rotation[z]", [0, 0.3, 0.6], [-0.1, 0.1, -0.1])])];
  v.avatar(av);
  v.phone(true);   // a phone in this room (SPEC 8.8): it takes calls, and v.call() makes them
  // A visitor pointing (SPEC 8.3): kept, with what it hit first, for the test to read.
  const ray = new t.THREE.Raycaster(), rayCam = new t.THREE.PerspectiveCamera();
  window.points = [];
  // Interactions (SPEC 8.3): spinning the cube is cosmetic; nothing else is taken (the vault's type is not here).
  window.spins = [];
  window.visitErrors = [];   // what Visit refused, for the test to read
  v.on("error", e => window.visitErrors.push(e));
  v.interactions({ spin: { cosmetic: true, label: "spin it", run: e => { e.object.rotation.y += 1; window.spins.push({ who: e.visitor.name, type: e.type }); } } });
  v.on("point", e => {
    ray.set(new t.THREE.Vector3(...e.from), new t.THREE.Vector3(...e.dir));
    rayCam.position.set(...e.from); rayCam.updateMatrixWorld(); ray.camera = rayCam;   // a sprite is met only with a camera
    const hit = ray.intersectObjects(t.scene.children, true).find(h => !h.object.userData.visitor);
    window.points.push({ ...e, hit: hit ? hit.object.name : null });
  });
  Visit.panel(document.getElementById("panel"), v);
  Visit.stage(v);   // the room visited: full-window, or in a corner while back in this one
})().catch(e => { document.body.insertAdjacentHTML("beforeend", `<p style="position:fixed;bottom:8px;left:8px">${e.message}</p>`); console.error(e); });
</script>
</body>
</html>
