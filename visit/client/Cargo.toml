[package]
name = "visit-client"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "Visit's local client: the lobby session, the links to other workrooms, and the page connection on 127.0.0.1 (../SPEC.md)"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = "0.3.34"
iroh = "1.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true      # a smaller file to hand around
lto = "thin"
