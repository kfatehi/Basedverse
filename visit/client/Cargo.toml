[package]
name = "visit"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "Visit, the one program a workroom needs (../../V2.md): the lobby session, the links to other workrooms, the page connection, the sign-in API"
publish = false

[dependencies]
auth = { path = "../../auth/client" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = "0.3.34"
iroh = "1.4"
postgresql_embedded = { version = "0.22.0", default-features = false, features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.44"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip"] }

[build-dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
