[package]
name = "auth"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "A workroom's sign-in, built into visit (../../V2.md): the owner's account, sessions and API keys, for its server on 127.0.0.1 (../SPEC.md)"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
getrandom = "0.3.4"
rpassword = "7.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

