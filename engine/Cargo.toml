[package]
name = "engine"
version = "2.1.1"
edition = "2021"
license = "MIT"
description = "The engine, built into visit (../V2.md 5): the room's server page in the headless Chrome visit carries, kept alive (SPEC.md 5)"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
