# The Postgres that visit runs (postgres/README.md), for each platform: made and tested on that platform by
# postgres/build, from postgres/versions.env. Run by hand (Actions → postgres → Run workflow); with "publish", it
# makes the release postgres-<version>-<build> with the archives and SHA256SUMS, never marked the latest (bin/setup
# fetches Visit from /releases/latest). Then postgres/pin, and commit what it changed. A push that changes postgres/
# (any branch) builds and tests, never publishes.
name: postgres

on:
  push:
    paths: ["postgres/**", ".github/workflows/postgres.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release postgres-<version>-<build> (else the archives are only this run's artifacts)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04, test: true }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, test: true }
          - { platform: macos-aarch64, os: macos-15, test: true }
          # an Apple silicon runner: the Intel build is checked and cut down, not run (as in release.yml)
          - { platform: macos-x86_64, os: macos-15, test: false }
          - { platform: windows-x86_64, os: windows-2025, test: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: postgres/build ${{ matrix.platform }} ${{ !matrix.test && '--no-test' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-${{ matrix.platform }}
          path: postgres/dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source postgres/versions.env
          tag="postgres-$POSTGRES_VERSION-$BUILD"
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat > ../notes.md <<EOF
          Postgres $POSTGRES_VERSION (build $BUILD), the database visit runs beside itself: it downloads the file for
          its platform once, checks it against the checksum it was built with, and keeps it. Not something to
          download by hand. Linux: compiled from source on glibc 2.28 (Debian 10+, Ubuntu 20.04+, RHEL 8+);
          macOS and Windows: theseus-rs/postgresql-binaries $THESEUS_RELEASE, cut down. How these are made:
          [postgres/README.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/postgres/README.md).
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Postgres $POSTGRES_VERSION for visit (build $BUILD)" --notes-file ../notes.md *
