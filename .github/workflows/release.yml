# visit-client and auth-client for each platform, built and tested on that platform. A tag v<version> (the
# version in visit/client/Cargo.toml and auth/client/Cargo.toml) publishes a release with the files; run by hand
# (Actions → release → Run workflow), it only builds them, as the run's artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, native: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, native: true }
          - { target: aarch64-apple-darwin, os: macos-15, native: true }
          - { target: x86_64-apple-darwin, os: macos-15, native: false }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, native: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: visit/client
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl-tools
      - name: Test
        if: matrix.native
        run: |
          cargo test --locked --target ${{ matrix.target }}
          (cd ../../auth/client && cargo test --locked --target ${{ matrix.target }})
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          (cd ../../auth/client && cargo build --release --locked --target ${{ matrix.target }})
      - name: Runs
        if: matrix.native
        run: |
          for bin in target/${{ matrix.target }}/release/visit-client ../../auth/client/target/${{ matrix.target }}/release/auth-client; do
            "$bin" --version
            "$bin" --help >/dev/null
          done
      - name: Package
        run: |
          mkdir -p ../../dist
          for crate in visit auth; do
            out=../../$crate/client/target/${{ matrix.target }}/release bin=$crate-client name=$crate-client-${{ matrix.target }}
            if [[ ${{ matrix.target }} == *windows* ]]; then
              cp "$out/$bin.exe" ../../LICENSE ../../dist/
              (cd ../../dist && 7z a -tzip -bso0 "$name.zip" "$bin.exe" LICENSE && rm "$bin.exe" LICENSE)
            else
              tar -czf "../../dist/$name.tar.gz" -C "$out" "$bin" -C "$PWD/../.." LICENSE
            fi
          done
          ls -l ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: clients-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the crate's version, and the changelog has it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' visit/client/Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME, but visit/client/Cargo.toml says $version"; exit 1; }
          auth=$(sed -n 's/^version = "\(.*\)"/\1/p' auth/client/Cargo.toml | head -n 1)
          [ "$auth" = "$version" ] || { echo "auth/client/Cargo.toml says $auth, visit/client/Cargo.toml $version: they are released together"; exit 1; }
          grep -q "VERSION = \"$version\"" visit/client/web/visit.js || { echo "visit/client/web/visit.js's VERSION is not $version"; exit 1; }
          grep -qE "^## $GITHUB_REF_NAME( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' entry: what changed, and what an integration does"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cat > ../notes.md <<EOF
          visit-client $GITHUB_REF_NAME, Visit's local client (one file for your machine, with visit.js built in),
          auth-client, a workroom's sign-in, and visit-engine, the room's page in a headless Chromium beside them
          (an image built from [engine/]($repo/blob/$GITHUB_REF_NAME/engine/) with Docker, not a file here).
          [visit/INTEGRATING.md]($repo/blob/$GITHUB_REF_NAME/visit/INTEGRATING.md),
          [auth/INTEGRATING.md]($repo/blob/$GITHUB_REF_NAME/auth/INTEGRATING.md) and
          [engine/INTEGRATING.md]($repo/blob/$GITHUB_REF_NAME/engine/INTEGRATING.md) say how to use them, and
          [CHANGELOG.md]($repo/blob/$GITHUB_REF_NAME/CHANGELOG.md) how to upgrade. This release:

          EOF
          # This release's entry in the changelog, without its heading.
          awk -v v="## $GITHUB_REF_NAME" 'index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") { on = 1; next }
                                           on && /^## / { exit } on' ../CHANGELOG.md \
            | sed -E "s#\]\((visit/|auth/|lobby/|bin/|engine/)#](${repo}/blob/${GITHUB_REF_NAME}/\1#g" >> ../notes.md   # its links, from the release page
          cat >> ../notes.md <<EOF

          ### The files

          | file | for |
          |---|---|
          | \`visit-client-x86_64-unknown-linux-musl.tar.gz\`, \`auth-client-…\` | Linux, x86_64 (static: any distribution) |
          | \`visit-client-aarch64-unknown-linux-musl.tar.gz\`, \`auth-client-…\` | Linux, ARM64 (static) |
          | \`visit-client-aarch64-apple-darwin.tar.gz\`, \`auth-client-…\` | macOS, Apple silicon |
          | \`visit-client-x86_64-apple-darwin.tar.gz\`, \`auth-client-…\` | macOS, Intel |
          | \`visit-client-x86_64-pc-windows-msvc.zip\`, \`auth-client-…\` | Windows, x86_64 |

          \`SHA256SUMS\` has their checksums. The macOS builds are not notarized: one downloaded with a browser
          needs \`xattr -d com.apple.quarantine visit-client\` (and auth-client) before it runs (one fetched with
          curl does not).
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "visit-client and auth-client $GITHUB_REF_NAME" --notes-file ../notes.md *
