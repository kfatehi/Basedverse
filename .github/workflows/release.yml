# visit for each platform, built, tested and started fresh on that platform (V2.md 6.2): one file with Postgres and
# Chrome inside it (the archives deps/pinned.json pins, from their deps-<n> release). A tag v<version> (the version
# in visit/client/Cargo.toml, auth/client/Cargo.toml and engine/Cargo.toml) publishes a release with the files; run
# by hand (Actions → release → Run workflow), it only builds them, as the run's artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, native: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, native: true }
          - { target: aarch64-apple-darwin, os: macos-15, native: true }
          - { target: x86_64-apple-darwin, os: macos-15, native: false }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, native: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl-tools
      - name: Test
        if: matrix.native
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p visit --target ${{ matrix.target }}
      - name: A fresh start
        if: matrix.native
        run: |
          bin=target/${{ matrix.target }}/release/visit py=python3
          [[ ${{ matrix.target }} == *windows* ]] && bin=$bin.exe py=python
          "$py" visit/client/tests/fresh_start.py "$bin"
      - name: Package
        run: |
          mkdir -p dist
          out=target/${{ matrix.target }}/release name=visit-${{ matrix.target }}
          if [[ ${{ matrix.target }} == *windows* ]]; then
            cp "$out/visit.exe" LICENSE dist/
            (cd dist && 7z a -tzip -bso0 "$name.zip" visit.exe LICENSE && rm visit.exe LICENSE)
          else
            tar -czf "dist/$name.tar.gz" -C "$out" visit -C "$PWD" LICENSE
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: visit-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the crate's version, and the changelog has it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' visit/client/Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME, but visit/client/Cargo.toml says $version"; exit 1; }
          for crate in auth/client engine; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' $crate/Cargo.toml | head -n 1)
            [ "$v" = "$version" ] || { echo "$crate/Cargo.toml says $v, visit/client/Cargo.toml $version: they are built together"; exit 1; }
          done
          grep -q "VERSION = \"$version\"" visit/client/web/visit.js || { echo "visit/client/web/visit.js's VERSION is not $version"; exit 1; }
          grep -qE "^## $GITHUB_REF_NAME( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' entry: what changed, and what an integration does"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cat > ../notes.md <<EOF
          visit $GITHUB_REF_NAME: the one program a workroom needs, one file for your machine. Its database
          (Postgres), the workroom's sign-in and the engine (with its headless Chrome) are inside it: nothing to
          install, no Docker. [visit/INTEGRATING.md]($repo/blob/$GITHUB_REF_NAME/visit/INTEGRATING.md) says how to
          use it, and [CHANGELOG.md]($repo/blob/$GITHUB_REF_NAME/CHANGELOG.md) how to upgrade. This release:

          EOF
          # This release's entry in the changelog, without its heading.
          awk -v v="## $GITHUB_REF_NAME" 'index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") { on = 1; next }
                                           on && /^## / { exit } on' ../CHANGELOG.md \
            | sed -E "s#\]\((visit/|auth/|lobby/|bin/|engine/)#](${repo}/blob/${GITHUB_REF_NAME}/\1#g" >> ../notes.md   # its links, from the release page
          cat >> ../notes.md <<EOF

          ### The files

          | file | for |
          |---|---|
          | \`visit-x86_64-unknown-linux-musl.tar.gz\` | Linux, x86_64 (any distribution with glibc 2.28 or newer) |
          | \`visit-aarch64-unknown-linux-musl.tar.gz\` | Linux, ARM64 (the same) |
          | \`visit-aarch64-apple-darwin.tar.gz\` | macOS, Apple silicon |
          | \`visit-x86_64-apple-darwin.tar.gz\` | macOS, Intel |
          | \`visit-x86_64-pc-windows-msvc.zip\` | Windows, x86_64 |

          \`SHA256SUMS\` has their checksums. About 150 MB each: Postgres and Chrome are inside, unpacked once into
          your data folder on first start. The macOS builds are not notarized: one downloaded with a browser needs
          \`xattr -d com.apple.quarantine visit\` before it runs (one fetched with curl does not).
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "visit $GITHUB_REF_NAME" --notes-file ../notes.md *
